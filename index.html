<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>트리니티 오스스메</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="오스스메">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#D97300">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F0; --surface:#FFFFFF; --ink:#1F2A2E; --muted:#5F6D73; --line:#D6DDDB;
  --amber:#D97300; --amber-ink:#FFFFFF; --amber-soft:#FBE7CC; --ok:#2C7A57; --ok-soft:#DCEFE5; --no:#B03F2C; --no-soft:#F6DED8;
  --cust:#E4ECEE; --tip:#FFF6E8; --m1:#C9D2D0; --m2:#F3C27A; --m3:#E89A3A; --m4:#2C7A57;
  color-scheme: light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121819; --surface:#1B2325; --ink:#ECF0EF; --muted:#9AA7AB; --line:#2B3638;
  --amber:#F2992E; --amber-ink:#1A1206; --amber-soft:#3A2810; --ok:#5DBB8E; --ok-soft:#173327; --no:#E07A64; --no-soft:#3A1E18;
  --cust:#223033; --tip:#2A2215; --m1:#36423F; --m2:#7A5A2C; --m3:#C7802F; --m4:#5DBB8E; color-scheme: dark; } }
:root[data-theme="dark"]{
  --bg:#121819; --surface:#1B2325; --ink:#ECF0EF; --muted:#9AA7AB; --line:#2B3638;
  --amber:#F2992E; --amber-ink:#1A1206; --amber-soft:#3A2810; --ok:#5DBB8E; --ok-soft:#173327; --no:#E07A64; --no-soft:#3A1E18;
  --cust:#223033; --tip:#2A2215; --m1:#36423F; --m2:#7A5A2C; --m3:#C7802F; --m4:#5DBB8E; color-scheme: dark; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.ja{font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:0 16px 96px}

/* start screen */
.start{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;max-width:440px;margin:0 auto;text-align:center}
.logo{width:116px;height:116px;border-radius:32px;background:var(--amber);display:grid;place-items:center;box-shadow:0 14px 40px -12px rgba(217,115,0,.55)}
.logo svg{width:70px;height:70px}
.wordmark{margin-top:20px;font-weight:700;letter-spacing:.18em;font-size:13px;color:var(--muted)}
.wordmark2{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;font-size:44px;line-height:1.1;margin-top:2px}
.wordmark3{color:var(--muted);font-size:14px;margin-top:6px}
.who{width:100%;margin-top:32px;text-align:left}
.who h3{font-size:14px;color:var(--muted);margin:0 0 8px;font-weight:600}
.plist{display:flex;flex-wrap:wrap;gap:8px}
.pbtn{padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.pbtn[aria-pressed="true"]{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;min-width:0;font:inherit;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.addrow button{padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.go{width:100%;margin-top:22px;min-height:60px;border-radius:18px;background:var(--amber);color:var(--amber-ink);font-size:19px;font-weight:700}
.go:disabled{opacity:.4}
.tipline{margin:14px 6px 0;font-size:12.5px;line-height:1.5;color:var(--muted);text-align:center;min-height:2.4em}
.cardwrap{position:relative}.flag{position:absolute;bottom:8px;right:8px;border:0;background:none;font-size:15px;opacity:.45;padding:6px;cursor:pointer;z-index:2}.flag:hover{opacity:1}
.rpsheet{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.rpsheet .box{background:var(--surface);color:var(--ink);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.rpsheet h3{margin:0 0 4px;font-size:16px}.rpsheet .q{font-size:13px;color:var(--muted);margin-bottom:12px}
.rpsheet .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.rpsheet .opts button{font:inherit;font-size:14px;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.rpsheet .opts button.on{border-color:var(--amber);background:var(--amber-soft);color:var(--amber)}
.rpsheet input{width:100%;font:inherit;font-size:15px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:12px;box-sizing:border-box}
.rpsheet .row{display:flex;gap:10px}.rpsheet .row .btn{flex:1}
.chg{font:inherit;font-size:12px;color:var(--muted);background:none;border:0;text-decoration:underline;padding:6px 4px;cursor:pointer;align-self:center}
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.ccard{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px;text-align:left;cursor:pointer}.ccard img,.ccard .qm{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;border-radius:12px;display:block}.ccard .qm{display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:900;color:var(--muted);background:var(--line)}.cimg{position:relative;overflow:hidden;border-radius:12px}.ccard .cimg img.blur{filter:blur(14px) grayscale(.4) brightness(.9);transform:scale(1.15)}.cimg .qmk{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:64px;font-weight:900;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.45)}
.medal{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;font-size:12px!important;font-weight:900;color:#4a3300;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 1px 3px rgba(0,0,0,.25)}.medal.m1{background:radial-gradient(circle at 35% 30%,#FFF3B0,#F2C230 60%,#C9971A)}.medal.m2{background:radial-gradient(circle at 35% 30%,#FFFFFF,#C9CED6 60%,#9097A3);color:#2f3540}.medal.m3{background:radial-gradient(circle at 35% 30%,#FFE1C4,#D4894A 60%,#A4602B);color:#3d1f08}
.cimg{position:relative}.cimg .lock{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:46px;opacity:.75;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
.ccard.lk img{filter:grayscale(1) brightness(.75)}.ccard .ct{font-weight:700;font-size:14px;margin-top:6px}.ccard .cs{font-size:12px;color:var(--muted);margin-top:2px}
.schead{display:flex;align-items:center;gap:10px;margin-bottom:8px}.schead img{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:top}.backb{font:inherit;font-size:13px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
#convBtn:disabled{opacity:.55}
.memline{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--muted)}.memline i{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}.memline u{display:block;height:100%;background:var(--ok)}
.uchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.uchips button{font:inherit;font-size:13px;padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}.uchips button.on{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}.uchips button.lk{opacity:.5}
.lockbox{text-align:center;padding:30px 10px;color:var(--muted);font-size:15px;line-height:1.6}
.conv{position:fixed;inset:0;z-index:60;background:var(--bg,#FFF8EE);display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.cvtop{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;font-weight:700;font-size:15px}
.cvtop button{font:inherit;font-size:14px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.cvstage{position:relative;height:30vh;min-height:190px;margin:0 14px;border-radius:22px;overflow:hidden;background:var(--amber-soft)}
.cvcust{position:absolute;right:0;bottom:0;height:100%;width:54%;object-fit:cover;object-position:top;border-radius:0 22px 22px 0;transition:transform .25s,filter .25s}
.cvchick{position:absolute;left:2%;bottom:2%;width:48%;max-width:230px;transition:transform .25s,filter .25s}
.cvchick svg{width:100%;height:auto}
.cvstage .dim{filter:saturate(.6) brightness(.85);transform:scale(.94)}
.cvstage .talk{transform:scale(1.04)}
.cvlog{flex:1;overflow-y:auto;padding:12px 14px 8px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:84%;padding:10px 12px;border-radius:16px;font-size:16px;line-height:1.45}
.bub.c{align-self:flex-end;background:var(--surface);border:1px solid var(--line);border-bottom-right-radius:4px}
.bub.s{align-self:flex-start;background:var(--amber-soft);border-bottom-left-radius:4px}
.bub .ja{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:18px}
.bub .pr{font-size:13px;color:var(--muted)}
.bub .ko{font-size:14px;margin-top:4px;transition:filter .4s}
.bub .ko.mask{filter:blur(6px);cursor:pointer}
.bub .mic.cvmic{width:40px;height:40px;margin:2px 0 6px 2px}.bub .mic.cvmic svg{width:22px;height:22px}
.cvhint{font-size:12px;color:var(--muted);margin-top:4px}
.bub .rp{border:0;background:none;font-size:18px;padding:2px 4px;cursor:pointer}
.bub.s.ok{box-shadow:inset 0 0 0 2px var(--ok)} .bub.s.no{box-shadow:inset 0 0 0 2px var(--no)}
.cvbar{padding:10px 14px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px}
.cvbar .btn{flex:1}
.offer{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.offer .box{background:var(--surface);border-radius:22px;padding:18px;max-width:380px;width:100%;text-align:center}
.offer img{width:110px;height:130px;object-fit:cover;object-position:top;border-radius:16px}
.offer h3{margin:10px 0 4px;font-size:18px}.offer p{margin:0 0 14px;color:var(--muted);font-size:14px}
.offer .actions{display:flex;gap:10px}.offer .btn{flex:1}

.pinin{width:100%;font:inherit;font-size:22px;letter-spacing:.5em;text-align:center;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.rank{display:flex;flex-direction:column;gap:6px}
.rk{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:12px;background:var(--bg);font-weight:600}
.rk.me{background:var(--amber-soft);color:var(--amber)}
.rk .no{font-weight:700;width:46px}
.choice{min-height:54px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:16px;font-weight:600;text-align:left;padding:10px 14px}
.choice.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.choice.wrongc{background:var(--no-soft);border-color:var(--no);color:var(--no)}
.mic.spk{background:var(--cust);color:var(--ink)}
.mic.spk::after{border-color:var(--muted)}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding:6px 0 6px}
.hudrow{display:flex;align-items:center;gap:10px}
.lv{flex:none;width:34px;height:34px;border-radius:10px;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center;font-weight:700;line-height:1;font-size:11px}
.lv b{font-size:15px;display:block}
.xp{flex:1;min-width:0}
.xp .nm{font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.xp .nm small{color:var(--muted);font-weight:500;font-size:12px}
.bar{height:5px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--amber);width:0;transition:width .5s ease}
.chips{display:flex;gap:5px;margin-top:6px;font-size:11.5px;color:var(--muted);flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips span{white-space:nowrap}
.chips span{padding:2px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.chips b{color:var(--ink)}
.stages{display:flex;gap:6px;margin:2px 0 12px}
.stages span{flex:1;font-size:12px;font-weight:600;color:var(--muted);text-align:center;padding:5px 0;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.stages span.on{background:var(--amber-soft);color:var(--amber);border-color:transparent}

/* card */
.card{background:var(--surface);border-radius:22px;padding:20px 18px 18px;flex:1;display:flex;flex-direction:column;min-height:430px;border:1px solid var(--line)}
.kind{font-size:13px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.kind b{color:var(--amber)}
.cue{margin-top:14px;background:var(--cust);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.cue .who2{font-size:12px;font-weight:600;color:var(--muted);flex:none;margin-top:3px}
.cue .t{flex:1}.cue .t .ja{font-size:17px;font-weight:700;line-height:1.4}.cue .t small{display:block;color:var(--muted);font-size:13px}
.play{flex:none;width:38px;height:38px;border-radius:50%;background:var(--surface);display:grid;place-items:center;border:1px solid var(--line)}
.play svg{width:16px;height:16px}
.task{margin:auto 0;padding:20px 0 14px}
.task .ko{font-size:clamp(24px,7vw,32px);font-weight:700;line-height:1.3}
.task .hint{margin-top:10px;color:var(--muted);font-size:14px}
.mic{width:64px;height:64px;border-radius:50%;background:var(--amber-soft);color:var(--amber);display:grid;place-items:center;margin-bottom:16px;position:relative;animation:wig 1.6s ease-in-out infinite}
.mic svg{width:30px;height:30px}
.mic::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--amber);animation:ring 1.6s ease-out infinite}
@keyframes wig{0%,100%{transform:rotate(0) scale(1)}10%{transform:rotate(-9deg) scale(1.06)}20%{transform:rotate(8deg) scale(1.06)}30%{transform:rotate(-5deg)}40%{transform:rotate(0) scale(1)}}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.6);opacity:0}}
.answer{margin:auto 0;padding:16px 0 10px}
.answer .jbig{font-size:clamp(26px,8vw,38px);font-weight:900;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.answer.long .jbig{font-size:clamp(21px,6vw,28px)}
.answer .reading{font-family:"Zen Kaku Gothic New",sans-serif;color:var(--amber);font-size:15px;font-weight:700;margin-top:6px}
.answer .pron{font-size:19px;font-weight:600;margin-top:10px}
.answer .mean{color:var(--muted);margin-top:4px}
.peek{margin-top:10px;font-size:14px;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.replay{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:600}
.replay svg{width:15px;height:15px}
.parts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.part{border-radius:10px;padding:5px 9px;background:var(--bg);border:1px solid var(--line);text-align:center}
.part .pj{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:16px;display:block}
.part .pm{font-size:11.5px;color:var(--muted);display:block;line-height:1.3}
.part.g{border-style:dashed;background:transparent}.part.g .pm{color:var(--amber)}
.tip{margin-top:12px;background:var(--tip);border-radius:14px;padding:10px 12px;font-size:14px}
.tip b{color:var(--amber)}
.selfnote{font-size:12px;color:var(--muted);text-align:center;margin:10px 0 2px}
.actions{display:grid;gap:10px;margin-top:8px}
.actions.two{grid-template-columns:1fr 1fr}
.btn{min-height:58px;border-radius:16px;font-size:17px;font-weight:700;padding:0 14px}
.btn.primary{background:var(--amber);color:var(--amber-ink)}
.btn.ok{background:var(--ok-soft);color:var(--ok)}
.btn.no{background:var(--no-soft);color:var(--no)}
.btn.ghost{border:1px solid var(--line);background:var(--surface)}
.btn:active{transform:scale(.985)}
.known{align-self:center;margin-top:10px;font-size:13px;color:var(--muted);padding:6px 10px;text-decoration:underline;text-underline-offset:3px}
.quit{display:block;margin:14px auto 0;font-size:14px;font-weight:600;color:var(--muted);padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.done{margin:auto 0}.done h2{font-size:24px;margin:0 0 8px;line-height:1.3}.done p{color:var(--muted);margin:0 0 6px}

/* summary + status */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.panel h3{margin:0 0 10px;font-size:15px}
.panel .sub{color:var(--muted);font-size:13px;margin:-6px 0 10px}
.big{font-size:30px;font-weight:700;line-height:1.1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg);border-radius:14px;padding:12px}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{font-size:22px}
.dist{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--m1)}
.dist i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0;background:var(--c)}
.wl{display:flex;flex-direction:column;gap:8px}
.wi{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--bg);text-align:left;width:100%}
.wi .tx{flex:1;min-width:0}.wi .ja{font-weight:700;font-size:16px;line-height:1.4}.wi .mn{font-size:13px;color:var(--muted)}
.wi .cnt{font-size:12px;font-weight:700;color:var(--no);flex:none}
.empty{color:var(--muted);font-size:14px}
.lessonrow{display:flex;justify-content:space-between;font-weight:700}
.stepbar{display:flex;gap:4px;margin-top:8px}
.stepbar span{flex:1;font-size:11px;text-align:center;color:var(--muted)}
.stepbar span i{display:block;height:6px;border-radius:3px;background:var(--line);margin-bottom:4px;overflow:hidden}
.stepbar span i u{display:block;height:100%;background:var(--amber)}

/* tabs, toast */
.toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .35s ease;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;height:44px;font-size:12.5px;font-weight:600;color:var(--muted)}
nav.tabs button[aria-selected="true"]{color:var(--amber)}
.dl{display:flex;flex-direction:column;gap:8px}
.ln{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.ln.c{background:var(--cust);border-color:transparent}
.ln .role{font-size:12px;font-weight:600;color:var(--muted);width:30px;flex:none;margin-top:3px}
.ln.s .role{color:var(--amber)}

.note{color:var(--muted);font-size:14px;margin:0 0 12px}
@media (prefers-reduced-motion: reduce){.mic,.mic::after{animation:none}.bar i{transition:none}}
.actbar{position:fixed;left:0;right:0;bottom:calc(44px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--bg);padding:10px 16px 8px;border-top:1px solid var(--line)}
.actbar .in{max-width:528px;margin:0 auto;display:flex;flex-direction:column}
.actbar .actions{margin-top:0}
.actbar .btn{min-height:64px;font-size:18px}
.actbar .known{margin-top:6px;padding:4px 10px}
.actbar .selfnote{margin:0 0 8px}
.hudquit{flex:none;font-size:12px;font-weight:700;color:#fff;padding:5px 10px;border-radius:999px;background:var(--no);box-shadow:0 2px 8px -2px rgba(176,63,44,.5)}
.saved{display:flex;gap:10px;align-items:flex-start;background:var(--ok-soft);color:var(--ok);border-radius:14px;padding:12px 14px;margin-top:12px;font-size:14px;line-height:1.5}
.saved b{display:block;font-size:15px}
#study .card{min-height:0}
.app.withbar{padding-bottom:230px}
.wpick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;max-height:150px;overflow:auto}
.wchip{border-radius:12px;padding:6px 10px;border:1px solid var(--line);background:var(--surface);text-align:center}
.wchip .pj{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:16px;display:block}
.wchip .pm{font-size:11.5px;color:var(--muted);display:block}
.wchip.on{background:var(--no-soft);border-color:var(--no);color:var(--no)}
.wchip.on .pm{color:var(--no)}
.lvup{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(18,24,25,.82);overflow:hidden}
.lvburst{position:absolute;width:520px;height:520px;border-radius:50%;background:repeating-conic-gradient(rgba(242,153,46,.18) 0 10deg,transparent 10deg 20deg);animation:spin 6s linear infinite,pop .5s ease-out}
.lvbox{position:relative;text-align:center;color:#fff;animation:bounce .7s cubic-bezier(.2,1.6,.4,1)}
.lvsmall{font-weight:700;letter-spacing:.3em;font-size:15px;color:#FFD08A}
.lvnum{font-weight:700;font-size:76px;line-height:1;text-shadow:0 6px 0 #B85F00,0 10px 30px rgba(0,0,0,.4)}
.lvmsg{margin-top:10px;font-size:15px;font-weight:600;opacity:.95}
.cf{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.2);opacity:0}}
@keyframes bounce{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion: reduce){.lvburst,.lvbox,.cf{animation:none}}
.mascot{width:190px;height:190px}
.chick{width:100%;height:100%;animation:bob 2.4s ease-in-out infinite;transform-origin:50% 90%;overflow:visible}
.chick .blink{animation:blink 4s infinite;transform-origin:center;transform-box:fill-box}
.chick .wing{animation:wave 1.2s ease-in-out infinite;transform-origin:150px 116px;transform-box:view-box}
.lvchick{width:120px;height:120px;margin:0 auto 6px}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}45%,55%{transform:translateY(-7px) scale(.98,1.02)}90%{transform:translateY(0) scale(1.04,.96)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
@media (prefers-reduced-motion: reduce){.chick,.chick .blink,.chick .wing{animation:none}}
[hidden]{display:none!important}

/* 단원: 진도는 단원 순서대로, 복습은 모든 단원에서 섞여 나온다 */
const UNITS=[{id:"u1",title:"여드름 자국이 남아요",W:WORDS,S:SENTS,D:DIALOG}].concat(window.__EXTRA_UNITS||[]);
const ITEMS=[];const BY={};
UNITS.forEach((U,u)=>{const pre=u===0?"":U.id+"-";const add=(x,t)=>ITEMS.push({...x,id:pre+x.id,t,u});
  const gm=Math.max(...U.W.map(w=>w.g),...U.S.map(s=>s.g));
  for(let g=1;g<=gm;g++){U.W.filter(w=>w.g===g).forEach(w=>add(w,"w"));U.S.filter(s=>s.g===g).forEach(s=>add(s,"s"));}
  U.D.forEach((d,i)=>{if(d.r==="c"&&d.ja.length>=6)add({...d,id:"c"+i},"l");if(d.r==="s"){const prev=U.D[i-1];add({...d,cue:prev&&prev.r==="c"?prev:null},"d");}});});
const curU=()=>{const it=ITEMS.find(x=>!S.st[x.id]);return it?it.u:UNITS.length-1;};
const unitTitle=()=>UNITS[curU()].title;
ITEMS.forEach(it=>BY[it.id]=it);
const TLABEL={w:"단어",s:"문장",d:"실전 대화",l:"손님 말 알아듣기"};

/* ---------- 반복 규칙 ----------
   간격(분): 처음 2 → 맞음 ×5 / 틀림 ×0.5(+3문제 뒤 재출제) / 이미 알아요 ×20. 최소 2분, 최대 6개월.
   60분 미만 간격은 '푼 문제 수'(1문제≈1분)로 세서 자리를 비운 시간은 빼고, 60분 이상은 실제 시간으로 잰다. */
const MIN=60e3,DAY=864e5,MULT={ok:6,no:0.5,known:20},FIRST=4,MIN_IVL=2,MAX_IVL=259200;
const XPV={ok:10,no:3,known:5,intro:4};
function dayKey(t=Date.now()){const d=new Date(t);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function fresh(){return{v:1,st:{},step:0,days:[],today:dayKey(),todayN:0,todayWrong:{},last:0,xp:0,updated:0};}

/* ---------- 사용자 ---------- */
const PKEY="osusume-profiles",SKEY=n=>"osusume-p-"+n;
let profiles=[],me=null,S=fresh();
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
profiles=lsGet(PKEY,[]);let picked=profiles[0]||null;
let docBase=null,saveT=null;
function docFor(n){return docBase?docBase.doc("osu-p-"+Array.from(n).map(c=>c.codePointAt(0).toString(36)).join("")):null;}
/* ---------- 숨김 학습 로그 (화면에 안 보임, 오류 점검용) ----------
   기기: localStorage "osusume-log-이름" 최근 5000건 / 계정 DB: "osu-log-사용자키-날짜" 하루치 문서
   한 줄 = [시각, 문제번호(step), 세션ID, 종류, ...내용] */
const APP_VER="v29";let LOGDAY=[],logT=null,logDayKey="";
function ukey(n){return Array.from(n).map(c=>c.codePointAt(0).toString(36)).join("");}
function logEv(type,...a){if(!me)return;try{const e=[Date.now(),S.step,SESS,type,...a];
  const k="osusume-log-"+me;const all=lsGet(k,[]);all.push(e);if(all.length>5000)all.splice(0,all.length-5000);lsSet(k,all);
  const dk=dayKey().replace(/-/g,".");if(dk!==logDayKey){logDayKey=dk;LOGDAY=[];}LOGDAY.push(e);
  if(docBase){clearTimeout(logT);logT=setTimeout(flushLog,2500);}}catch(x){}}
async function flushLog(){try{if(!docBase||!me)return;const d=docBase.doc("osu-log-"+ukey(me)+"-"+logDayKey);
  const sn=await d.get();let prev=sn.exists?(sn.data().e||[]):[];const seen=new Set(prev.map(x=>x[0]+"|"+x[3]+"|"+x[1]));
  LOGDAY.forEach(x=>{if(!seen.has(x[0]+"|"+x[3]+"|"+x[1]))prev.push(JSON.stringify(x));});
  prev=prev.map(x=>typeof x==="string"?x:JSON.stringify(x)).slice(-2000);LOGDAY=[];
  await d.set({name:me,ver:APP_VER,day:logDayKey,e:prev});}catch(x){}}
window.addEventListener("error",ev=>logEv("ERR",String(ev.message||ev).slice(0,200),(ev.filename||"").slice(-30)+":"+(ev.lineno||"")));
window.addEventListener("unhandledrejection",ev=>logEv("ERR",String(ev.reason).slice(0,200)));
function snap(id){const st=S.st[id];if(!st)return null;return{ivl:Math.round(st.ivl||0),ok:st.ok||0,w:st.wrong||0,lad:st.lad,kn:st.kn,ds:st.dueStep,da:st.dueAt?Math.round((st.dueAt-Date.now())/MIN):null};}

  const byFresh=(a,b)=>((sessN[a.id]||0)-(sessN[b.id]||0))||(mastery(a)-mastery(b))||((S.st[a.id].seen||0)-(S.st[b.id].seen||0));

"🌱 하루 10분도 충분해요. 매일 조금씩이 한 번에 몰아서보다 훨씬 오래 남아요.",
"😊 틀려도 괜찮아요. 손님은 발음보다 말을 걸어준 마음을 기억해요.",
"🔁 '틀렸어요'를 누르는 건 실패가 아니라 복습 예약이에요.",
"🗣️ 눈으로만 보지 말고 꼭 소리 내서 말해보세요. 입이 기억해야 매장에서 나와요.",
"⭐ 손님이 「日本語上手ですね!」라고 하면 성공이에요. 그 말을 들을 때까지!",
"🏪 교과서 일본어가 아니라, 약국 카운터에서 진짜 쓰는 말만 모았어요.",
"⌨️ 키보드가 있다면 → 맞았어요, ← 틀렸어요, ↑ 다시 듣기, ↓ 이미 알아요",
"🎧 블루투스 스피커나 이어폰을 연결하면 다음곡은 맞았어요, 이전곡은 틀렸어요, 재생 버튼은 다시 듣기예요.",
"🔊 말풍선의 스피커를 누르면 몇 번이든 다시 들을 수 있어요.",
"🎬 단원을 다 익히면 대화문 탭에서 손님을 만나 실전 연습을 할 수 있어요.",
"🤔 이미 아는 말은 '이미 알아요'를 누르세요. 덜 자주 나와서 모르는 말에 더 집중할 수 있어요.",
"⏸️ 바쁠 땐 '그만할래요'를 누르세요. 진도는 자동으로 저장되고 다음에 이어서 해요.",
"🚩 발음이나 뜻이 이상하면 🚩를 눌러 알려주세요. 바로 고칠게요."];
function showTip(){try{let i=Math.floor(Math.random()*TIPS.length);const last=+lsGet("osusume-tip",-1);if(i===last)i=(i+1)%TIPS.length;lsSet("osusume-tip",i);$("#tipline").textContent=TIPS[i];}catch(e){}}
showTip();

// ===== 키보드 · 블루투스 버튼 =====
const vis=b=>b&&b.offsetParent!==null&&!b.disabled;
function visBtns(){const scope=[...document.querySelectorAll(".offer:not([hidden]) button,.rpsheet button,#conv:not([hidden]) #cvBar button,#actin button,#card button")];return scope.filter(vis);}
function findBtn(re){return visBtns().find(b=>re.test(b.textContent));}
function keyAct(k){if(!$("#startView").hidden)return false;
  if(k==="ok"){const b=findBtn(/^맞았어요/);if(b){b.click();return true;}}
  if(k==="no"){const b=findBtn(/^틀렸어요/);if(b){b.click();return true;}}
  if(k==="known"){const b=visBtns().find(b=>b.classList.contains("known"));if(b){b.click();return true;}}
  if(k==="replay"){if(CV){const r=[...document.querySelectorAll("#cvLog .rp")].pop();if(r){r.click();return true;}}
    const r=visBtns().find(b=>b.classList.contains("replay"));if(r){r.click();return true;}
    if(window.__curId&&BY[window.__curId]){hush();say(BY[window.__curId].ja);return true;}}
  if(k==="primary"){const bs=visBtns().filter(b=>!/^(맞았어요|틀렸어요)/.test(b.textContent)&&!b.classList.contains("known")&&!b.classList.contains("replay")&&!b.classList.contains("rp"));
    if(findBtn(/^맞았어요/))return false;const b=bs[bs.length-1];if(b){b.click();return true;}}
  return false;}
document.addEventListener("keydown",e=>{const t=e.target;if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"))return;if(e.metaKey||e.ctrlKey||e.altKey)return;
  const m={ArrowRight:"ok",ArrowLeft:"no",ArrowUp:"replay",ArrowDown:"known"," ":"primary",Enter:"primary"}[e.key];
  if(m&&keyAct(m))e.preventDefault();});
try{if("mediaSession" in navigator){const ms=navigator.mediaSession;ms.metadata=new MediaMetadata({title:"트리니티 오스스메",artist:"일본어 학습"});
  const H={nexttrack:()=>keyAct("ok"),previoustrack:()=>keyAct("no"),play:()=>keyAct("replay"),pause:()=>keyAct("replay"),seekforward:()=>keyAct("ok"),seekbackward:()=>keyAct("no")};
  for(const [a,f] of Object.entries(H)){try{ms.setActionHandler(a,f);}catch(e){}}}}catch(e){}

// ===== 오류 신고 =====
function openReport(){const id=window.__curId;if(!id)return;const it=BY[id];const sh=el("div","rpsheet");const box=el("div","box");
  box.append(el("h3",null,"🚩 이 문제에 오류가 있나요?"),el("div","q",it.ja+" — "+it.m));
  const op=el("div","opts");let pick=null;["발음이 이상해요","뜻이 이상해요","일본어가 이상해요","기타"].forEach(t=>{const b=el("button",null,t);b.onclick=()=>{pick=t;[...op.children].forEach(x=>x.classList.toggle("on",x===b));};op.append(b);});
  const memo=el("input");memo.placeholder="메모 (선택)";memo.maxLength=200;
  const row=el("div","row");const c=el("button","btn ghost","취소"),s=el("button","btn ok","보내기");
  c.onclick=()=>sh.remove();sh.onclick=e=>{if(e.target===sh)sh.remove();};
  s.onclick=async()=>{if(!pick){toast("사유를 하나 골라주세요");return;}const rec={name:me||"",id,ja:it.ja,m:it.m,unit:(UNITS[it.u]||{}).title||"",reason:pick,memo:memo.value.trim(),at:Date.now(),ver:APP_VER,done:false};
    sh.remove();logEv("REPORT",id,pick);try{if(docBase)await docBase.doc("osu-rep-"+Date.now()+"-"+ukey(me||"x")).set(rec);toast("신고 고마워요! 확인해서 고칠게요");}catch(e){toast("전송 실패, 잠시 후 다시 해주세요");}};
  row.append(c,s);box.append(op,memo,row);sh.append(box);document.body.append(sh);}
$("#flagBtn").onclick=openReport;
</script>
</body>
</html>
