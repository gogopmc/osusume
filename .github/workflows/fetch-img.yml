name: fetch-images
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get install -y imagemagick >/dev/null 2>&1 || true
          mkdir -p img; changed=0
          while read n x; do
            [ -z "$n" ] && continue
            [ -f img/c$n.jpg ] && continue
            curl -sSfL -o /tmp/c.png "https://d8j0ntlcm91z4.cloudfront.net/user_3KtI32pMQ3R7HnVDVkhilxtY6yu/hf_20261119_$x.png"
            convert /tmp/c.png -resize 480x -quality 78 img/c$n.jpg; changed=1
          done < img/list.txt
          [ $changed = 1 ] || exit 0
          git config user.name Claude; git config user.email noreply@anthropic.com
          git add img; git commit -m "손님 사진 추가"; git push
