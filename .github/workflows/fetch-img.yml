name: fetch-images
on: push
permissions:
  contents: write
jobs:
  f:
    if: hashFiles('img/c7.jpg') == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get install -y imagemagick >/dev/null
          mkdir -p img; i=1
          for x in 024553_8939e0d6-df7e-406e-b567-1f1d6ef59a0e 024612_7f3374f3-bd94-4a59-bced-2355175ec307 024612_3a474781-56b0-42de-b15d-442c9ce6e52b 024553_c0bc67e9-29b2-4d82-9760-8a9b25d45f4e 024552_381e7215-b5e6-4699-8c89-1a5d272c6903 024552_ca3c9112-5e22-426a-9547-6b0d1e898a73 024612_936caade-4149-4359-8fd0-dd677625032a; do
            curl -sSL -o /tmp/c.png "https://d8j0ntlcm91z4.cloudfront.net/user_3KtI32pMQ3R7HnVDVkhilxtY6yu/hf_20261119_$x.png"
            convert /tmp/c.png -resize 480x -quality 78 img/c$i.jpg; i=$((i+1)); done
          git config user.name Claude; git config user.email noreply@anthropic.com
          git add img; git commit -m "손님 사진 앱에 포함"; git push
